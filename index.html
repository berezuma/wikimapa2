<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euskarazko Wikipediaren Mapa</title>

    <!-- Leaflet.js mapen liburutegiaren estilo-orria -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Leaflet.markercluster: markatzaileak multzokatzeko -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"
          integrity="sha512-mQ77VzAakzdpWdgfL/lM1ksNy89uFgibRQANsNneSTMD/bj0Y/8+94XMwYhnbzx8eki2hrbPpDm0vD0CiT2lcg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"
          integrity="sha512-6ZCLMiYwTeli2rVh3XAPxy3YoR5fVxGdH/pz+KMCzRY2M65Emgkw00Yqmhh8qLGeYQ3LbVZGdmOX9KUjSKr0TA=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>


    <!-- Letra-tipoa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Estilo pertsonalizatuak */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            height: 100dvh; /* mugikorretan helbide-barra kontuan hartuta */
            width: 100vw;
            z-index: 10;
        }
        .leaflet-container {
            font-family: 'Inter', sans-serif;
        }
        /* Artikuluen popup txartela */
        /* Markatzaileen koloreak, taldearen arabera (iragazki-paneleko taldeak + besteak) */
        :root {
            --wm-kultura: #c2410c;
            --wm-natura: #15803d;
            --wm-herriak: #1d4ed8;
            --wm-besteak: #334155;
            --wm-cluster: #334155;
        }
        .wm-kultura { --wm-color: var(--wm-kultura); }
        .wm-natura { --wm-color: var(--wm-natura); }
        .wm-herriak { --wm-color: var(--wm-herriak); }
        .wm-besteak { --wm-color: var(--wm-besteak); }
        /* Puntua: 20 px-ko ukipen-eremua, 16 px-ko zirkulu ikusgaia */
        .wm-marker::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: var(--wm-color);
            border: 2px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
            transition: transform 0.15s ease;
        }
        .wm-marker:hover::after {
            transform: scale(1.3);
        }
        .wm-swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--wm-color);
            border: 1.5px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
        }
        /* Multzoak: kolore neutro bakarra, tamaina kopuruaren arabera */
        .marker-cluster.wm-cluster {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--wm-cluster);
            color: #ffffff;
            font: 600 12px/1 'Inter', sans-serif;
            border: 3px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        .wm-legend {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            padding: 8px 10px;
            font: 12px/1.6 'Inter', sans-serif;
            color: #374151;
        }
        .wm-legend div {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Argazki-markatzaileak (zoom handian). Selektore luzea: Leaflet-en
           ".leaflet-container .leaflet-marker-pane img { width: auto }" gainditzeko */
        .leaflet-container .leaflet-marker-pane .wm-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--wm-color);
            box-shadow: 0 0 0 2px #ffffff, 0 3px 10px rgba(0, 0, 0, 0.4);
            background: #e5e7eb;
            transition: transform 0.15s ease;
            animation: wm-pop 0.35s ease-out;
        }
        .leaflet-container .leaflet-marker-pane .wm-photo:hover img {
            transform: scale(1.15);
        }
        @keyframes wm-pop {
            from { transform: scale(0.4); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        /* Harritu nazazu botoia */
        .wm-surprise {
            color: #c2410c;
        }
        .wm-surprise.spinning svg {
            animation: wm-spin 0.8s ease-in-out;
        }
        @keyframes wm-spin {
            to { transform: rotate(360deg) scale(1.1); }
        }
        /* Sarrera: markatzaileak muga marraztu ondoren agertzen dira */
        .leaflet-marker-pane {
            transition: opacity 0.9s ease;
        }
        .wm-intro-running .leaflet-marker-pane {
            opacity: 0;
        }
        .wm-intro-card, .wm-timeline-card {
            animation: wm-intro-in 0.6s ease-out;
        }
        /* Denbora-lerroa irekita dagoenean, mezuak barraren gainean */
        body.timeline-open #mapMessage, body.timeline-open #loader {
            bottom: 9rem;
        }
        #intro.leaving .wm-intro-card {
            opacity: 0;
            transform: translateY(-12px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        @keyframes wm-intro-in {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to { opacity: 1; transform: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .leaflet-container .leaflet-marker-pane .wm-photo img, .wm-intro-card, .wm-timeline-card, .wm-surprise.spinning svg { animation: none; }
        }

        /* Mugikorrean zooma bi hatzekin egiten da; aitortza txikiagoa */
        @media (max-width: 639px) {
            .leaflet-control-zoom, .wm-legend { display: none; }
            .leaflet-control-attribution { font-size: 10px; }
        }
        .article-popup .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }
        .article-popup .leaflet-popup-content {
            margin: 14px 16px;
            font-size: 14px;
        }
        .article-popup .leaflet-popup-content p {
            margin: 0;
        }
        .article-popup a.article-read {
            color: #ffffff;
        }
        .article-popup a.leaflet-popup-close-button {
            width: 32px;
            height: 32px;
            font: 22px/32px 'Inter', sans-serif;
            color: #6b7280;
        }
        #searchResults {
            max-height: 400px;
            overflow-y: auto;
        }
        #filterPanel {
            max-height: 100vh;
            overflow-y: auto;
        }
        #searchResults::-webkit-scrollbar, .leaflet-popup-content::-webkit-scrollbar, #filterPanel::-webkit-scrollbar {
            width: 6px;
        }
        #searchResults::-webkit-scrollbar-track, .leaflet-popup-content::-webkit-scrollbar-track, #filterPanel::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #searchResults::-webkit-scrollbar-thumb, .leaflet-popup-content::-webkit-scrollbar-thumb, #filterPanel::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        #searchResults::-webkit-scrollbar-thumb:hover, .leaflet-popup-content::-webkit-scrollbar-thumb:hover, #filterPanel::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .article-tooltip {
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-weight: 600;
            padding: 5px 10px;
            color: #333;
        }
        /* Alboko panelaren estiloak */
        #filterPanel {
            transition: transform 0.3s ease-in-out;
            transform: translateX(-105%);
            will-change: transform;
        }
        #filterPanel.open {
            transform: translateX(0);
        }
        .map-button {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .map-button:hover {
            background-color: #f7fafc;
        }
    </style>

    <!-- Tailwind CSS diseinurako (sortua: npm run build:css) -->
    <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-gray-100">

    <!-- Goiburua eta Bilatzailea -->
    <header class="absolute top-2 left-2 sm:top-4 sm:left-4 z-20 w-auto max-w-[calc(100vw-4rem)] sm:max-w-md">
        <div class="flex items-center space-x-2">
            <div class="bg-white bg-opacity-95 p-3 sm:p-4 shadow-lg rounded-lg flex-grow">
                <div class="flex items-center mb-2">
                    <h1 class="text-base sm:text-xl font-bold text-gray-800 leading-tight">Euskarazko Wikipediaren Mapa</h1>
                </div>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Bilatu artikulu bat..." aria-label="Bilatu artikulu bat" role="combobox" aria-autocomplete="list" aria-controls="searchResults" aria-expanded="false" autocomplete="off" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <div id="searchResults" role="listbox" aria-label="Bilaketaren emaitzak" class="hidden absolute mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg z-30"></div>
                </div>
                <!-- Iragazki aktiboak (JSk betetzen du) -->
                <div id="activeFilters" aria-label="Iragazki aktiboak" class="hidden flex flex-wrap gap-1 mt-2"></div>
            </div>
            <button id="filterButton" class="map-button relative" aria-label="Iragazkiak" aria-controls="filterPanel" aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>
                <span id="filterCount" class="hidden absolute -top-1 -right-1 min-w-[1.25rem] h-5 px-1 rounded-full bg-blue-600 text-white text-xs font-bold leading-5 text-center"></span>
            </button>
        </div>
    </header>

    <!-- Maparen kontrol botoiak -->
    <div class="absolute top-2 right-2 sm:top-4 sm:right-4 z-20 space-y-2">
        <button id="surpriseButton" class="map-button wm-surprise" aria-label="Harritu nazazu: ausazko artikulu bat" title="Harritu nazazu">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>
        </button>
        <button id="timelineButton" class="map-button" aria-label="Denbora-lerroa" aria-pressed="false" aria-controls="timeline" title="Denbora-lerroa">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </button>
        <button id="locateButton" class="map-button" aria-label="Nire kokapena">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        </button>
        <button id="shareButton" class="map-button" aria-label="Partekatu mapa">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12s-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6.012l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.342a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z" /></svg>
        </button>
    </div>

    <!-- Iragazkien Panela -->
    <div id="filterPanel" role="dialog" aria-labelledby="filterPanelTitle" inert class="absolute top-0 left-0 w-80 bg-white shadow-lg z-30 p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 id="filterPanelTitle" class="text-xl font-bold">Iragazkiak eta Aukerak</h2>
            <button id="closeFilterButton" aria-label="Itxi iragazkiak" class="text-gray-600 hover:text-gray-900 text-3xl font-bold">&times;</button>
        </div>
        <div id="filter-content">
            <div id="category-filters" class="space-y-1 text-sm text-gray-700">
                <p class="category-group flex items-center gap-1.5 font-semibold text-gray-500 text-xs uppercase pt-3" data-group="kultura"><span class="wm-swatch wm-kultura" aria-hidden="true"></span>Kultura eta Ondarea</p>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q33506"> <span>Museoak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q23413"> <span>Gazteluak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q1785071"> <span>Gotorlekuak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q16560"> <span>Jauregiak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q16970"> <span>Elizak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q56750657 Q108325"> <span>Ermitak eta kaperak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q44613"> <span>Monasterioak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q12518"> <span>Dorreak eta dorretxeak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q4989906"> <span>Monumentuak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q839954"> <span>Arkeologia-guneak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q101659"> <span>Trikuharriak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q12280"> <span>Zubiak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q39715"> <span>Itsasargiak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                
                <p class="category-group flex items-center gap-1.5 font-semibold text-gray-500 text-xs uppercase pt-3" data-group="natura"><span class="wm-swatch wm-natura" aria-hidden="true"></span>Natura eta Geografia</p>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q8502"> <span>Mendiak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q35509"> <span>Kobazuloak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q40080"> <span>Hondartzak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q4022"> <span>Ibaiak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q23397 Q131681"> <span>Aintzirak eta urtegiak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q34038"> <span>Ur-jauziak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q473972"> <span>Naturagune babestuak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                
                <p class="category-group flex items-center gap-1.5 font-semibold text-gray-500 text-xs uppercase pt-3" data-group="herriak"><span class="wm-swatch wm-herriak" aria-hidden="true"></span>Herriak eta Azpiegiturak</p>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q486972"> <span>Herriak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q44782"> <span>Portuak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q3914"> <span>Eskolak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2" data-category="Q483110"> <span>Estadioak</span><span class="category-count ml-auto pl-2 text-xs text-gray-400 tabular-nums"></span></label>
            </div>
        </div>
        <div class="mt-4 pt-4 border-t border-gray-200">
            <p id="categoryCountsNote" class="hidden text-xs text-gray-500 mb-2">Zenbakiak: ikuspegi honetako artikuluak.</p>
            <button id="clearFilterButton" class="w-full bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-lg hover:bg-gray-300">Garbitu iragazkiak</button>
        </div>
    </div>

    <!-- Maparen edukiontzia -->
    <div id="map"></div>
    
    <!-- Maparen gaineko mezuak -->
    <div id="mapMessage" role="status" aria-live="polite" class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 z-20 w-max max-w-[calc(100vw-2rem)] bg-white bg-opacity-90 p-3 rounded-lg shadow-lg text-center [overflow-wrap:anywhere]">
        <p id="mapMessageText" class="font-semibold text-gray-700"></p>
    </div>

    <!-- Denbora-lerroa: sorrera-data duten lekuak, urtearen arabera -->
    <div id="timeline" role="region" aria-label="Denbora-lerroa" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-[min(40rem,calc(100vw-2rem))]">
        <div class="wm-timeline-card rounded-2xl bg-white bg-opacity-95 shadow-2xl px-4 py-3">
            <div class="flex items-center gap-3">
                <button id="timelinePlay" class="shrink-0 w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700" aria-label="Erreproduzitu">
                    <svg id="timelinePlayIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
                    <svg id="timelinePauseIcon" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
                </button>
                <div class="min-w-0 flex-grow">
                    <div class="flex items-baseline gap-2">
                        <span id="timelineYear" class="text-2xl font-bold text-gray-900 tabular-nums"></span>
                        <span id="timelineEra" class="text-sm font-semibold text-gray-500 truncate"></span>
                        <span id="timelineCount" class="ml-auto text-xs text-gray-500 tabular-nums whitespace-nowrap"></span>
                    </div>
                    <input id="timelineSlider" type="range" min="0" max="0" value="0" class="w-full accent-blue-600 cursor-pointer" aria-label="Urtea">
                </div>
                <button id="timelineClose" class="shrink-0 self-start text-gray-500 hover:text-gray-900 text-2xl leading-none" aria-label="Itxi denbora-lerroa">&times;</button>
            </div>
            <p class="mt-1 text-xs text-gray-500">Sorrera-data duten lekuak bakarrik (<span id="timelineTotal"></span>), Wikidatatik.</p>
        </div>
    </div>

    <!-- Sarrera animatua (lehen bisitan bakarrik; ez du mapa blokeatzen) -->
    <div id="intro" class="hidden absolute inset-x-0 top-1/3 z-30 flex justify-center pointer-events-none px-4" aria-hidden="true">
