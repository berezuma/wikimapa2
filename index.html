<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euskarazko Wikipediaren Mapa</title>

    <!-- Leaflet.js mapen liburutegiaren estilo-orria -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Leaflet.markercluster: markatzaileak multzokatzeko -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"
          integrity="sha512-mQ77VzAakzdpWdgfL/lM1ksNy89uFgibRQANsNneSTMD/bj0Y/8+94XMwYhnbzx8eki2hrbPpDm0vD0CiT2lcg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"
          integrity="sha512-6ZCLMiYwTeli2rVh3XAPxy3YoR5fVxGdH/pz+KMCzRY2M65Emgkw00Yqmhh8qLGeYQ3LbVZGdmOX9KUjSKr0TA=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>


    <!-- Letra-tipoa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Estilo pertsonalizatuak */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 10;
        }
        .leaflet-popup-content {
            font-size: 14px;
            max-height: 250px;
            overflow-y: auto;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
        }
        .leaflet-popup-content a {
            font-weight: 600;
        }
        #searchResults {
            max-height: 400px;
            overflow-y: auto;
        }
        #filterPanel {
            max-height: 100vh;
            overflow-y: auto;
        }
        #searchResults::-webkit-scrollbar, .leaflet-popup-content::-webkit-scrollbar, #filterPanel::-webkit-scrollbar {
            width: 6px;
        }
        #searchResults::-webkit-scrollbar-track, .leaflet-popup-content::-webkit-scrollbar-track, #filterPanel::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #searchResults::-webkit-scrollbar-thumb, .leaflet-popup-content::-webkit-scrollbar-thumb, #filterPanel::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        #searchResults::-webkit-scrollbar-thumb:hover, .leaflet-popup-content::-webkit-scrollbar-thumb:hover, #filterPanel::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .article-tooltip {
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-weight: 600;
            padding: 5px 10px;
            color: #333;
        }
        /* Alboko panelaren estiloak */
        #filterPanel {
            transition: transform 0.3s ease-in-out;
            transform: translateX(-105%);
        }
        #filterPanel.open {
            transform: translateX(0);
        }
        .map-button {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .map-button:hover {
            background-color: #f7fafc;
        }
    </style>

    <!-- Tailwind CSS diseinurako (sortua: npm run build:css) -->
    <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-gray-100">

    <!-- Goiburua eta Bilatzailea -->
    <header class="absolute top-2 left-2 sm:top-4 sm:left-4 z-20 w-auto max-w-[calc(100vw-4rem)] sm:max-w-md">
        <div class="flex items-center space-x-2">
            <div class="bg-white bg-opacity-90 backdrop-blur-sm p-3 sm:p-4 shadow-lg rounded-lg flex-grow">
                <div class="flex items-center mb-2">
                    <h1 class="text-lg sm:text-xl font-bold text-gray-800">Euskarazko Wikipediaren Mapa</h1>
                </div>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Bilatu artikulu bat..." aria-label="Bilatu artikulu bat" role="combobox" aria-autocomplete="list" aria-controls="searchResults" aria-expanded="false" autocomplete="off" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <div id="searchResults" role="listbox" aria-label="Bilaketaren emaitzak" class="hidden absolute mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg z-30"></div>
                </div>
            </div>
            <button id="filterButton" class="map-button" aria-label="Iragazkiak" aria-controls="filterPanel" aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>
            </button>
        </div>
    </header>

    <!-- Maparen kontrol botoiak -->
    <div class="absolute top-2 right-2 sm:top-4 sm:right-4 z-20 space-y-2">
        <button id="locateButton" class="map-button" aria-label="Nire kokapena">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        </button>
        <button id="shareButton" class="map-button" aria-label="Partekatu mapa">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12s-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6.012l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.342a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z" /></svg>
        </button>
    </div>

    <!-- Iragazkien Panela -->
    <div id="filterPanel" role="dialog" aria-labelledby="filterPanelTitle" inert class="absolute top-0 left-0 w-80 bg-white shadow-lg z-30 p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 id="filterPanelTitle" class="text-xl font-bold">Iragazkiak eta Aukerak</h2>
            <button id="closeFilterButton" aria-label="Itxi iragazkiak" class="text-gray-600 hover:text-gray-900 text-3xl font-bold">&times;</button>
        </div>
        <div id="filter-content">
            <div id="category-filters" class="space-y-1 text-sm text-gray-700">
                <p class="font-semibold text-gray-500 text-xs uppercase pt-3">Kultura eta Ondarea</p>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q33506"> Museoak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q23413"> Gazteluak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q1785071"> Gotorlekuak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q16560"> Jauregiak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q16970"> Elizak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q56750657 Q108325"> Ermitak eta kaperak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q44613"> Monasterioak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q12518"> Dorreak eta dorretxeak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q4989906"> Monumentuak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q839954"> Arkeologia-guneak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q101659"> Trikuharriak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q12280"> Zubiak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q39715"> Itsasargiak</label>
                
                <p class="font-semibold text-gray-500 text-xs uppercase pt-3">Natura eta Geografia</p>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q8502"> Mendiak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q35509"> Kobazuloak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q40080"> Hondartzak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q4022"> Ibaiak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q23397 Q131681"> Aintzirak eta urtegiak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q34038"> Ur-jauziak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q473972"> Naturagune babestuak</label>
                
                <p class="font-semibold text-gray-500 text-xs uppercase pt-3">Herriak eta Azpiegiturak</p>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q486972"> Herriak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q44782"> Portuak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q3914"> Eskolak</label>
                <label class="flex items-center"><input type="checkbox" class="mr-2" data-category="Q483110"> Estadioak</label>
            </div>
        </div>
        <div class="mt-4 pt-4 border-t border-gray-200 flex space-x-2">
            <button id="applyFilterButton" class="flex-grow bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700">Aplikatu</button>
            <button id="clearFilterButton" class="bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-lg hover:bg-gray-300">Garbitu</button>
        </div>
    </div>

    <!-- Maparen edukiontzia -->
    <div id="map"></div>
    
    <!-- Oharra / Footer -->
    <footer class="absolute bottom-2 right-2 z-20 bg-white bg-opacity-80 backdrop-blur-sm p-2 rounded-md shadow-md text-xs text-gray-700 text-right max-w-xs">
        <p>
            <span class="font-semibold">Beñat Erezuma</span>-k egina, Wikipedia eta OpenStreetMap erabiliz.
        </p>
        <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.eu" target="_blank" rel="noopener noreferrer" class="font-semibold text-blue-600 hover:underline">Lizentzia: CC BY-SA 4.0</a>
    </footer>

    <!-- Maparen gaineko mezuak -->
    <div id="mapMessage" role="status" aria-live="polite" class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 z-20 w-max max-w-[calc(100vw-2rem)] bg-white bg-opacity-90 p-3 rounded-lg shadow-lg text-center [overflow-wrap:anywhere]">
        <p id="mapMessageText" class="font-semibold text-gray-700"></p>
    </div>

    <!-- Kargatzen ari denaren adierazlea -->
    <div id="loader" class="hidden absolute top-0 left-0 w-full h-full bg-white bg-opacity-70 z-30 flex items-center justify-center">
        <div class="flex flex-col items-center">
            <svg class="animate-spin h-10 w-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p id="loader-text" class="mt-4 text-gray-700 font-semibold text-center px-4"></p>
        </div>
    </div>

    <!-- Leaflet.js mapen liburutegiaren kodea -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"
            integrity="sha512-OFs3W4DIZ5ZkrDhBFtsCP6JXtMEDGmhl0QPlmWYBJay40TT1n3gt2Xuw8Pf/iezgW9CdabjkNChRqozl/YADmg=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script type="module" src="js/app.js"></script>

</body>
</html>
