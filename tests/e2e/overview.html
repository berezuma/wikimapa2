<!doctype html>
<html lang="eu">
<head><meta charset="utf-8"><title>Bista orokorraren proba</title></head>
<body>
<pre id="result"></pre>
<script type="module">
import { run, check, until, sleep, loadApp, setCategories } from './harness.js';

// Multzoen zenbakiak + banakako markatzaileak
const countArticles = (d) => [...d.querySelectorAll('.leaflet-marker-icon')]
    .reduce((sum, icon) => sum + (icon.classList.contains('marker-cluster') ? Number(icon.textContent) || 0 : 1), 0);

run(async () => {
    const { d } = await loadApp('?lat=43.0&lon=-2.0&zoom=9');
    const message = () => d.getElementById('mapMessage').classList.contains('hidden') ? '' : d.getElementById('mapMessageText').textContent;

    check('zoom 9an multzoak agertzen dira', await until(() => d.querySelector('.marker-cluster')));
    await sleep(1500);
    const total = countArticles(d);
    check('Euskal Herri osoko milaka artikulu', total > 5000, total);
    check('ez da "erdiko 10 km" oharra agertzen', !/10 km/.test(message()), message());

    // Iragazkiak zoom txikian ere funtzionatzen du (bista orokorreko datuekin, sarerik gabe)
    setCategories(d, 'Q33506');
    await sleep(500);
    await until(() => d.getElementById('loader').classList.contains('hidden'));
    await sleep(1000);
    const museums = countArticles(d);
    check('museoen iragazkia zoom 9an', museums > 50 && museums < total, `${museums} museo`);
    check('ez da "Zooma handitu" oharra agertzen', !/Zooma handitu/.test(message()), message());
    check('iragazkien botoiak kopurua erakusten du', d.getElementById('filterCount').textContent === '1');
    const chip = d.querySelector('#activeFilters button');
    check('iragazki aktiboaren etiketa', chip?.textContent.includes('Museoak'), chip?.textContent);
    chip?.click();
    await sleep(1500);
    check('etiketa sakatuta iragazkia kentzen da', d.getElementById('activeFilters').classList.contains('hidden') && countArticles(d) === total, countArticles(d));

    // Panela irekitzean, kategoria bakoitzeko kopurua
    d.getElementById('filterButton').click();
    const museumCount = await until(() => d.querySelector('input[data-category="Q33506"]').parentElement.querySelector('.category-count').textContent);
    check('kategorien kopuruak panelean', Number(museumCount.replace(/\D/g, '')) > 50, museumCount);
    check('oinak ez du OSM-ren aitortza estaltzen', !d.querySelector('footer') && /OpenStreetMap/.test(d.querySelector('.leaflet-control-attribution').textContent));

    // Datu estatikoen eremutik kanpo (Madril): erdiko zirkulua eta oharra
    const outside = await loadApp('?lat=40.4168&lon=-3.7038&zoom=9');
    const outsideMessage = await until(() => !outside.d.getElementById('mapMessage').classList.contains('hidden') && outside.d.getElementById('mapMessageText').textContent);
    check('eremutik kanpo erdiko zirkuluaren oharra', /10 km/.test(outsideMessage || ''), outsideMessage);
});
</script>
</body>
</html>
