<!doctype html>
<html lang="eu">
<head><meta charset="utf-8"><title>Iragazkien proba</title></head>
<body>
<pre id="result"></pre>
<script type="module">
import { run, check, until, sleep, loadApp } from './harness.js';

run(async () => {
    const { d } = await loadApp('?lat=43.2569&lon=-2.9236&zoom=14');
    const markers = () => d.querySelectorAll('.leaflet-marker-icon').length;
    const loaderHidden = () => d.getElementById('loader').classList.contains('hidden');
    const message = () => d.getElementById('mapMessage').classList.contains('hidden') ? '' : d.getElementById('mapMessageText').textContent;
    const apply = (...categories) => {
        d.querySelectorAll('#category-filters input').forEach(cb => { cb.checked = categories.includes(cb.dataset.category); });
        d.getElementById('applyFilterButton').click();
    };

    await until(() => markers() > 0);
    await until(loaderHidden);

    const started = performance.now();
    apply('Q16970');
    await sleep(300);
    await until(loaderHidden, 60000);
    const seconds = (performance.now() - started) / 1000;
    check('elizen iragazkiak errorerik gabe amaitzen du', !/Errorea/.test(message()), message());
    check('elizen iragazkiak emaitzak ditu', markers() > 0, markers());
    check('iragazkia 15 s baino gutxiagoan', seconds < 15, `${seconds.toFixed(1)} s`);

    // Kategoria aldatzean eremuaren cachea erabiltzen da: kargarik gabe
    const churches = markers();
    apply('Q33506');
    await sleep(300);
    check('kategoria aldatzean emaitzak berehala', loaderHidden() && markers() > 0 && markers() !== churches, `${churches} -> ${markers()}`);

    // Q-id anitzeko kategoria (aintzirak eta urtegiak) ez da hausten
    apply('Q23397 Q131681');
    await sleep(300);
    check('Q-id anitzeko kategoriak errorerik ez', !/Errorea/.test(message()), message() || markers());

    d.getElementById('clearFilterButton').click();
    await sleep(500);
    await until(loaderHidden, 30000);
    check('iragazkiak garbitzean markatzaile guztiak itzultzen dira', markers() > churches, markers());
});
</script>
</body>
</html>
