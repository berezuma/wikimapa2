<!doctype html>
<html lang="eu">
<head><meta charset="utf-8"><title>Smoke proba</title></head>
<body>
<pre id="result"></pre>
<script type="module">
import { run, check, until, sleep, loadApp, type } from './harness.js';

run(async () => {
    const { w, d } = await loadApp('?lat=43.263&lon=-2.935&zoom=15');
    // Multzoak ere .leaflet-marker-icon dira; banakako markatzaileak bakarrik zenbatu
    const singleMarkers = () => [...d.querySelectorAll('.leaflet-marker-icon:not(.marker-cluster)')];
    const markers = () => d.querySelectorAll('.leaflet-marker-icon').length;
    const message = () => d.getElementById('mapMessage').classList.contains('hidden') ? '' : d.getElementById('mapMessageText').textContent;

    check('markatzaileak kargatzen dira', await until(() => markers() > 0), markers());
    check('Euskal Herriko muga marrazten da', await until(() => d.querySelector('path[stroke="#D50000"]')));

    // Goiko markatzailearen popupak autoPan eragiten du (moveend); popupak irekita jarraitu behar du
    const top = singleMarkers().sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)[0];
    top.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    const link = await until(() => d.querySelector('.leaflet-popup-content a'));
    check('popupak artikuluaren esteka du', link && /^https:\/\/eu\.wikipedia\.org\/wiki\/./.test(link.href), link?.href);
    await sleep(3000);
    check('popupa irekita mapa mugitu ondoren', d.querySelector('.leaflet-popup-content'));
    check('laburpena kargatu da', !/kargatzen/.test(d.querySelector('.leaflet-popup-content')?.textContent || ''));

    const input = d.getElementById('searchInput');
    const popupTitle = () => d.querySelector('.leaflet-popup-content h3')?.textContent;
    const findOption = (title) => until(() => [...d.querySelectorAll('#searchResults [role=option]')].find(o => o.dataset.title === title));

    type(w, input, 'Guggenheim');
    const option = await findOption('Guggenheim Bilbao Museoa');
    check('bilaketak emaitzak ematen ditu', option);
    const described = [...d.querySelectorAll('#searchResults [role=option] .text-xs')].map(e => e.textContent);
    check('emaitzek deskribapena dute', described.length > 0, described.join(' | '));
    option?.click();
    check('hautatutako artikuluaren popupa irekitzen da', await until(() => popupTitle() === 'Guggenheim Bilbao Museoa'), popupTitle());

    // Partekatzeko estekak irekitako artikulua barne hartzen du (arbelik gabe, esteka mezuan erakusten da)
    d.getElementById('shareButton').click();
    const shared = await until(() => !d.getElementById('mapMessage').classList.contains('hidden') && d.getElementById('mapMessageText').textContent);
    check('partekatzeko estekak artikulua du', /artikulua=Guggenheim|'Guggenheim Bilbao Museoa' artikuluaren esteka/.test(shared || ''), shared);

    type(w, input, 'Bernardo Atxaga');
    const person = await findOption('Bernardo Atxaga');
    person?.click();
    check('koordenaturik gabeko artikulua Wikidataren bidez kokatzen da', await until(() => popupTitle() === 'Bernardo Atxaga'), popupTitle());
    check('kokapen erlazionatua adierazten da', /Kokapen erlazionatua/.test(d.querySelector('.leaflet-popup-content')?.textContent || ''));
    d.querySelector('.leaflet-popup-close-button')?.click();
    await sleep(500);
    const tooltips = [...d.querySelectorAll('.article-tooltip')].map(t => t.textContent);
    check('popupa itxita, etiketa bakarra (aurrekoa kenduta)', tooltips.length === 1 && tooltips[0] === 'Bernardo Atxaga', tooltips.join(', '));

    // ?artikulua= parametroak artikulua irekitzen du
    const shared2 = await loadApp('?artikulua=' + encodeURIComponent('Donostiako Zinemaldia'));
    const title2 = await until(() => shared2.d.querySelector('.leaflet-popup-content h3')?.textContent === 'Donostiako Zinemaldia', 30000);
    check('?artikulua= parametroak popupa irekitzen du', title2);

    // Popupa irekita dagoela iragazki-panela ireki: popupa ixten da eta panela ikusgai (mugikorreko akatsa)
    const p2 = shared2.d.getElementById('filterPanel');
    check('panela itxita dagoenean ez da marrazten (visibility)', shared2.w.getComputedStyle(p2).visibility === 'hidden');
    shared2.d.getElementById('filterButton').click();
    await sleep(600);
    check('panela irekitzean popupa ixten da', !shared2.d.querySelector('.leaflet-popup'));
    check('panela ikusgai, aukerekin', shared2.w.getComputedStyle(p2).visibility === 'visible' && p2.querySelectorAll('#category-filters input').length === 24);
});
</script>
</body>
</html>
